[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "adapters*",
  "apps*",
  "evaluation*",
  "governance*",
  "infrastructure*",
  "observability*",
  "platform_common*",
  "protocols*",
  "rag*",
  "sdk*",
  "security*",
  "services*"
]
[project]
name = "agentic-platform"
version = "0.1.0"
description = "Framework-neutral enterprise Agentic AI Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
runtime = ["langgraph>=0.2.0", "langchain>=0.2.0"]
data = ["sqlalchemy>=2.0.0", "asyncpg>=0.29.0", "redis>=5.0.0"]
events = ["aiokafka>=0.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

