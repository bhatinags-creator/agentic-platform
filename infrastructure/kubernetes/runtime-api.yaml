apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: runtime-api }
  template:
    metadata:
      labels: { app: runtime-api }
    spec:
      containers:
        - name: runtime-api
          image: agentic-platform:local
          command: ["uvicorn", "apps.runtime_api.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
